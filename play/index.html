<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Rally</title>
<meta name="description" content="Drive fast. Stay on the road. Get trophies.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Rally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;1,9..144,900&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="c" aria-label="Rally stage"></canvas>

<header id="top" hidden>
  <div>
    <div class="hn" id="hn">Pinewood</div>
    <div class="sub" id="hsub">Gravel</div>
    <div class="hcoins" id="hcoins"><i class="coin" aria-hidden="true"></i><b id="ccount">0</b><span class="sr">coins</span></div>
  </div>
  <div class="pts"><div class="pv" id="clock">0:00.0</div><div class="sub" id="best">No best yet</div></div>
  <div id="prog" aria-hidden="true"><i class="tk" id="tk1"></i><i class="tk" id="tk2"></i><b id="pdot"></b></div>
</header>

<div id="note" hidden role="status" aria-live="polite">
  <svg id="noteArrow" viewBox="0 0 44 44" aria-hidden="true"><path id="noteArrowPath" d="" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div><b id="noteT">Left 3</b><small id="noteN"></small></div>
</div>

<div id="wheelWrap" hidden aria-hidden="true">
  <svg id="wheel" viewBox="0 0 400 250">
    <!-- the fixed pointer: when the wheel's notch sits under it, you're going straight -->
    <path d="M187 0 H213 L200 17 Z" fill="#000"/>
    <g id="wrot" style="transform-origin:200px 230px">
      <circle cx="200" cy="230" r="184" fill="none" stroke="#000" stroke-width="34"/>
      <circle cx="200" cy="230" r="184" fill="none" stroke="#fff" stroke-width="25"/>
      <circle cx="200" cy="230" r="184" fill="none" stroke="#000" stroke-width="11" stroke-dasharray="2.5 17" stroke-linecap="round" opacity=".55"/>
      <path d="M26 230 H146 M254 230 H374 M200 176 V62" stroke="#000" stroke-width="30" stroke-linecap="round"/>
      <path d="M26 230 H146 M254 230 H374 M200 176 V62" stroke="#fff" stroke-width="21" stroke-linecap="round"/>
      <path d="M44 230 H140 M260 230 H356" stroke="#000" stroke-width="2.4" stroke-dasharray="1 9" stroke-linecap="round"/>
      <!-- the centre notch, on top of the rim -->
      <rect x="186" y="26" width="28" height="42" rx="7" fill="#000"/>
      <rect x="197" y="33" width="6" height="28" rx="3" fill="#fff"/>
      <circle cx="200" cy="230" r="62" fill="#fff" stroke="#000" stroke-width="5"/>
      <circle cx="200" cy="230" r="50" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="2 5"/>
    </g>
    <text id="wkmh" x="200" y="210" text-anchor="middle">0</text>
    <text x="200" y="229" text-anchor="middle" class="wu">km/h</text>
  </svg>
</div>
<button id="pause" type="button" aria-label="Pause" hidden>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="8" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="18" y="8" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
</button>
<button id="rescue" type="button" hidden>Back on the road</button>
<div id="hint" hidden><span id="hintT">Turn the wheel to steer</span></div>

<div id="toast" hidden role="status" aria-live="polite"><b id="toastT"></b><small id="toastS"></small></div>
<div id="callout"></div>
<div id="card" hidden><div class="panel" id="panel"></div></div>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/stages.js"></script>
<script src="js/cars.js"></script>
<script src="js/render.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens.js"></script>
<script src="js/garage.js"></script>
<script src="js/flow.js"></script>
<script src="js/physics.js"></script>
<script src="js/input.js"></script>
<script src="js/draw.js"></script>
<script src="js/main.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
