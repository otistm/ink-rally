<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ink Rally: drive fast, stay on the road, get trophies</title>
<meta name="description" content="A minimal ink-drawn mobile rally game. Three stages, a co-driver calling every bend, and one thumb on the wheel.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Rally">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ink Rally">
<meta property="og:title" content="Ink Rally">
<meta property="og:description" content="Drive fast. Stay on the road. Get trophies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,900&family=Figtree:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--ink:#000;--soft:#5c5c5c;--display:"Fraunces",Georgia,serif;--ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#fff;--ink:#000;--soft:#5c5c5c}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
main{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;place-items:end center;align-content:end;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
@media (min-aspect-ratio:1/1){main{place-items:center end;align-content:center;padding-right:6vw}}
.card{width:min(420px,100%);background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;box-shadow:7px 8px 0 var(--ink);padding:28px 24px 22px;text-align:center;
  animation:in .8s cubic-bezier(.3,.7,.3,1) both .2s}
@keyframes in{0%{opacity:0;transform:translateY(60px) scale(.8,1.2)}55%{opacity:1;transform:translateY(-8px) scale(1.04,.96)}78%{transform:translateY(2px) scale(.99,1.01)}100%{transform:none}}
h1{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(50px,14vw,74px);line-height:.95;margin:0;letter-spacing:-.01em}
.tag{font-weight:800;font-size:17px;margin:12px 0 22px}
.play{display:block;width:100%;background:var(--ink);color:var(--paper);text-decoration:none;border-radius:18px;padding:17px 20px;font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;
  border:2.5px solid var(--ink);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.play:hover{transform:translateY(-2px)}
.play:active{transform:scale(1.04,.9)}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.feats{list-style:none;padding:0;margin:20px 0 4px;display:grid;gap:10px;text-align:left}
.feats li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;font-weight:600;font-size:14.5px;line-height:1.35}
.feats svg{width:30px;height:30px}
.feats b{font-weight:800}
footer{margin-top:12px;font-size:12px;font-weight:600;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <div class="card">
    <h1>Ink Rally</h1>
    <p class="tag">Drive fast. Stay on the road. Get trophies.</p>
    <a class="play" href="/play/">Play</a>
    <ul class="feats">
      <li><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 34V20a8 8 0 0 1 8-8h8"/><path d="M23 7l5 5-5 5"/></g></svg><span><b>A co-driver</b> calls every bend before you reach it.</span></li>
      <li><svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="20" cy="22" r="12" fill="#fff"/><circle cx="20" cy="22" r="4" fill="#000"/><path d="M20 22l-9 6"/></g></svg><span><b>One thumb.</b> Turn the wheel, drift the bends, fire off a boost.</span></li>
      <li><svg viewBox="0 0 40 44" aria-hidden="true"><g stroke="#000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M10 7H5c0 6 3 9 6.5 9.5M30 7h5c0 6-3 9-6.5 9.5" fill="none"/><path d="M10 4h20v9c0 7-4.5 11-10 11S10 20 10 13z" fill="#000"/><path d="M17 24h6v6h-6z" fill="#fff"/><path d="M11 31h18v6H11z" fill="#000"/></g></svg><span><b>Gravel, tarmac and snow.</b> Beat the clock for a trophy on each stage.</span></li>
    </ul>
  </div>
  <footer>Best on a phone, held upright.</footer>
</main>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});
/* ---------- an ink rally car sliding round a loop of gravel behind the card ---------- */
(()=>{
  const cv=document.getElementById('c'), ctx=cv.getContext('2d'), TAU=Math.PI*2;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,D=1,pat=null;
  function tile(){ const c=document.createElement('canvas'); c.width=c.height=Math.round(110*D); const g=c.getContext('2d'); g.scale(D,D);
    g.fillStyle='#fff'; g.fillRect(0,0,110,110); g.strokeStyle='#000'; g.globalAlpha=.3; g.lineWidth=1.2; g.lineCap='round';
    let s=7; const r=()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; };
    for(let i=0;i<8;i++){ const x=8+r()*94,y=8+r()*94; g.beginPath(); g.moveTo(x-3,y+2); g.lineTo(x,y-3); g.lineTo(x+3,y+2); g.stroke(); }
    pat=ctx.createPattern(c,'repeat'); pat.setTransform&&pat.setTransform(new DOMMatrix([1/D,0,0,1/D,0,0])); }
  function resize(){ D=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*D; cv.height=H*D; tile(); }
  addEventListener('resize',resize); resize();
  // the loop lives above the card in portrait and beside it in landscape
  const box=()=>H>W?{x:W/2,y:H*.22,rx:W*.36,ry:H*.14}:{x:W*.3,y:H/2,rx:W*.22,ry:H*.3};
  const at=u=>{ const b=box(), a=u*TAU; return [b.x+Math.cos(a)*b.rx*(1+.18*Math.sin(2*a)), b.y+Math.sin(a)*b.ry]; };
  const trees=[[.08,.1],[.9,.08],[.5,.02],[.93,.36],[.05,.4],[.5,.24],[.22,.3],[.76,.2]];
  const dust=[];
  let t0=performance.now(), last=t0;
  function frame(now){
    const t=still?2:(now-t0)/1000, dt=Math.min(.05,(now-last)/1000); last=now;
    ctx.setTransform(D,0,0,D,0,0); ctx.fillStyle=pat; ctx.fillRect(0,0,W,H);
    const s=Math.min(W,H), rw=Math.max(26,s*.07); ctx.lineCap=ctx.lineJoin='round';
    const road=()=>{ ctx.beginPath(); for(let i=0;i<=120;i++){ const [x,y]=at(i/120); i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); };
    road(); ctx.strokeStyle='#000'; ctx.lineWidth=rw+5; ctx.stroke(); road(); ctx.strokeStyle='#fff'; ctx.lineWidth=rw; ctx.stroke();
    ctx.save(); ctx.globalAlpha=.1; ctx.lineWidth=2; ctx.strokeStyle='#000'; road(); ctx.setLineDash([2,7]); ctx.stroke(); ctx.restore();
    // the car goes round, its tail hanging out through the tighter ends
    const u=(t*.09)%1, [x,y]=at(u), [x2,y2]=at(u+.004), dir=Math.atan2(y2-y,x2-x), slide=.45*Math.pow(Math.abs(Math.cos(u*TAU)),3);
    if(!still&&Math.random()<.7) dust.push({x:x-Math.cos(dir)*12,y:y-Math.sin(dir)*12,r:3+Math.random()*3,t:0,life:.7+Math.random()*.6});
    for(let i=dust.length-1;i>=0;i--){ const d=dust[i]; d.t+=dt; if(d.t>d.life) dust.splice(i,1); }
    const R=d=>{ const k=d.t/d.life; return (d.r+10*Math.sqrt(k))*(k>.65?1-(k-.65)/.35:1); };
    ctx.fillStyle='#000'; ctx.beginPath(); dust.forEach(d=>{ const r=R(d)+2.2; ctx.moveTo(d.x+r,d.y); ctx.arc(d.x,d.y,r,0,TAU); }); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); dust.forEach(d=>{ const r=R(d); ctx.moveTo(d.x+r,d.y); ctx.arc(d.x,d.y,r,0,TAU); }); ctx.fill();
    const L=Math.max(30,s*.075), Wd=L*.45;
    ctx.save(); ctx.translate(x,y); ctx.rotate(dir+slide);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-L/2+4,-Wd/2+5,L,Wd);
    ctx.fillStyle='#000'; [[.3,-.55],[.3,.55],[-.3,-.55],[-.3,.55]].forEach(([a,b])=>ctx.fillRect(a*L-L*.1,b*Wd-Wd*.1,L*.2,Wd*.2));
    ctx.beginPath(); ctx.roundRect?ctx.roundRect(-L/2,-Wd/2,L,Wd,Wd*.3):ctx.rect(-L/2,-Wd/2,L,Wd); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2.2; ctx.strokeStyle='#000'; ctx.stroke();
    ctx.fillStyle='#000'; ctx.fillRect(L*.13,-Wd*.38,L*.12,Wd*.76); ctx.fillRect(-L*.31,-Wd*.36,L*.08,Wd*.72); ctx.fillRect(-L/2-2,-Wd/2,4,Wd);
    ctx.beginPath(); ctx.arc(-L*.05,0,Wd*.22,0,TAU); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=1.4; ctx.stroke();
    ctx.restore();
    trees.forEach((q,i)=>{ const tx=q[0]*W, ty=q[1]*H*(H>W?1:2), r=Math.max(16,s*.045);
      ctx.fillStyle='rgba(0,0,0,.09)'; ctx.beginPath(); ctx.ellipse(tx+r*.35,ty+r*.32,r,r*.9,0,0,TAU); ctx.fill();
      ctx.beginPath(); for(let k=0;k<=28;k++){ const a=k/28*TAU+i, rr=r*(k%2?.74:1); k?ctx.lineTo(tx+Math.cos(a)*rr,ty+Math.sin(a)*rr):ctx.moveTo(tx+Math.cos(a)*rr,ty+Math.sin(a)*rr); }
      ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=2.2; ctx.strokeStyle='#000'; ctx.stroke(); });
    if(!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
